<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NTS Report Deadline Monitoring</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#172b45;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1220px;margin:auto;padding:30px 22px}header{background:#142d49;color:white;padding:24px 0}header .wrap{padding-top:0;padding-bottom:0}h1{margin:0;font-size:25px}header p{margin:8px 0 0;color:#c8d7e8}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:24px 0}.stat,.tile{background:white;border:1px solid #e0e7ef;border-radius:14px;padding:20px;box-shadow:0 2px 9px #13243a0b}.stat span{color:#63738a;font-size:13px}.stat strong{display:block;font-size:30px;margin-top:7px}.tools{display:flex;gap:12px;margin:0 0 18px;flex-wrap:wrap}input,select{border:1px solid #cdd7e4;background:white;border-radius:9px;padding:12px;font-size:14px;min-width:190px}input{flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:15px}.tile .top{display:flex;justify-content:space-between;gap:10px;align-items:center}.tile h2{font-size:17px;margin:0;overflow-wrap:anywhere}.pill{font-size:11px;font-weight:700;padding:6px 9px;border-radius:30px;background:#e6edf6;color:#3c526c}.pill.good{background:#e4f5ea;color:#18723e}.pill.soon{background:#fff2d7;color:#956000}.pill.bad{background:#ffe6e7;color:#b12b39}.number{font-size:45px;font-weight:750;margin:18px 0 2px}.number.good{color:#16814a}.number.soon{color:#bb7c05}.number.bad{color:#c93643}.desc{font-size:13px;color:#687b90}.date{border-top:1px solid #e9edf3;padding-top:14px;margin-top:17px;font-size:13px;color:#586d83}.muted{color:#63738a;font-size:13px}.empty{padding:35px;text-align:center;color:#667b91}.error{color:#b12b39}footer{margin-top:24px;font-size:12px;color:#6c7c90}@media(max-width:650px){.summary{grid-template-columns:repeat(2,1fr)}.wrap{padding:18px 14px}h1{font-size:21px}}
</style></head><body><header><div class="wrap"><h1>NTS Report Deadline Monitoring</h1><p>10 working days from end date · Saturdays and Sundays excluded</p></div></header><main class="wrap"><div id="status" class="muted">Loading report data…</div><section class="summary" id="summary"></section><div class="tools"><input id="search" placeholder="Search NTS ID…" aria-label="Search NTS ID"><select id="filter" aria-label="Filter status"><option value="active">Active reports</option><option value="all">All reports</option><option value="good">On Track</option><option value="soon">Due Soon / Today</option><option value="bad">Overdue</option><option value="submitted">Submitted</option><option value="notstarted">Not Started</option></select><select id="sort" aria-label="Sort"><option value="deadline">Nearest deadline</option><option value="id">NTS ID</option></select></div><section class="grid" id="cards"></section><footer>Source: ArcGIS Online · Published snapshot refreshes on the GitHub Actions schedule</footer></main><script>
let records=[];const $=id=>document.getElementById(id);
function parseDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return null;let [y,m,d]=s.split('-').map(Number);let x=new Date(y,m-1,d,12);return x.getFullYear()===y&&x.getMonth()===m-1&&x.getDate()===d?x:null}
function workday(d){return d.getDay()!==0&&d.getDay()!==6}
function addDays(start,n){let d=new Date(start);for(let i=0;i<n;){d.setDate(d.getDate()+1);if(workday(d))i++}return d}
function compare(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()?0:a<b?-1:1}
function workDiff(today,deadline){let cmp=compare(today,deadline);if(cmp===0)return 0;let low=cmp<0?today:deadline,high=cmp<0?deadline:today,count=0;let d=new Date(low);while(compare(d,high)<0){d.setDate(d.getDate()+1);if(workday(d))count++}return cmp<0?count:-count}
function format(d){return d?new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d):'—'}
function classify(r){if(String(r.approval_status||'').trim().toLowerCase()==='approved')return {type:'submitted',label:'Submitted',days:null,deadline:null};let start=parseDate(r.end_dt);if(!start)return {type:'notstarted',label:'Not Started',days:null,deadline:null};let deadline=addDays(start,10),now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12),days=workDiff(today,deadline);return {type:days<0?'bad':days<=2?'soon':'good',label:days<0?'Overdue':days===0?'Due Today':days<=2?'Due Soon':'On Track',days,deadline}}
function render(){let mapped=records.map(r=>({...r,s:classify(r)}));let n=t=>mapped.filter(r=>r.s.type===t).length;$('summary').innerHTML=[['On Track',n('good')],['Due Soon / Today',n('soon')],['Overdue',n('bad')],['Submitted',n('submitted')]].map(([t,v])=>`<div class="stat"><span>${t}</span><strong>${v}</strong></div>`).join('');let term=$('search').value.trim().toLowerCase(),f=$('filter').value;let shown=mapped.filter(r=>String(r.id??'').toLowerCase().includes(term)&&(f==='all'||f==='active'&&r.s.type!=='submitted'||r.s.type===f));shown.sort((a,b)=>$('sort').value==='id'?String(a.id??'').localeCompare(String(b.id??'')):((a.s.deadline?.getTime()??Infinity)-(b.s.deadline?.getTime()??Infinity)));let target=$('cards');target.replaceChildren();if(!shown.length){target.innerHTML='<div class="empty">No matching reports</div>';return}for(let r of shown){let card=document.createElement('article');card.className='tile';let top=document.createElement('div');top.className='top';let title=document.createElement('h2');title.textContent=r.id??'Unnamed report';let pill=document.createElement('span');pill.className='pill '+(r.s.type==='good'?'good':r.s.type==='bad'?'bad':r.s.type==='soon'?'soon':'');pill.textContent=r.s.label;top.append(title,pill);let number=document.createElement('div');number.className='number '+(r.s.type==='good'?'good':r.s.type==='bad'?'bad':r.s.type==='soon'?'soon':'');number.textContent=r.s.days===null?'—':Math.abs(r.s.days);let desc=document.createElement('div');desc.className='desc';desc.textContent=r.s.days===null?(r.s.type==='submitted'?'Report approved':'End date unavailable'):r.s.days<0?'Working days overdue':r.s.days===0?'Deadline is today':'Working days left';let date=document.createElement('div');date.className='date';date.textContent='End date: '+(r.end_dt?format(parseDate(r.end_dt)):'—')+' · Deadline: '+format(r.s.deadline);card.append(top,number,desc,date);target.append(card)}}
async function load(){try{let response=await fetch('./data/nts.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);let data=await response.json();if(!Array.isArray(data.records))throw Error('Invalid JSON');records=data.records;$('status').textContent=`${records.length} reports · Last sync: ${data.updated_at?new Date(data.updated_at).toLocaleString():'unknown'}`;render()}catch(e){$('status').textContent='Unable to load data: '+e.message;$('status').className='muted error'}}
for(let id of ['search','filter','sort'])$(id).addEventListener(id==='search'?'input':'change',render);load();setInterval(load,300000);setInterval(()=>{if(records.length)render()},60000);
</script></body></html>
